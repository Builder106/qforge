<style>
:root { color-scheme: light dark; --bg: #ffffff; --ink: #1f2328; --muted: #59636e; --edge: #59636e; --box: #8c959f; --group: #d1d9e0; --groupfill: #f6f8fa; --accent: #0969da; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: #f0f6fc; --muted: #9198a1; --edge: #9198a1; --box: #656c76; --group: #3d444d; --groupfill: #151b23; --accent: #4493f8; } }
html, body { margin: 0; background: var(--bg); }
main { max-width: 876px; margin: 0 auto; }
svg { display: block; width: 100%; height: auto; }
text { font-family: "IBM Plex Sans", system-ui, sans-serif; fill: var(--ink); }
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
.muted { fill: var(--muted); }
.accent-text { fill: var(--accent); }
.bg, .halo { fill: var(--bg); }
.node { fill: var(--bg); stroke-width: 1.25; }
.node.box { stroke: var(--box); }
.node.accent { stroke: var(--accent); stroke-width: 2; }
.group { fill: var(--groupfill); stroke: var(--group); }
.boundary { fill: none; stroke: var(--box); stroke-dasharray: 6 6; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
.edge.accent { stroke: var(--accent); stroke-width: 2; }
.edge.dashed { stroke-dasharray: 6 5; }
.lifeline { fill: none; stroke: var(--group); stroke-dasharray: 4 5; }
.tip { fill: var(--edge); }
.tip-accent { fill: var(--accent); }
</style>
</head>

<title id="diagram-title">QForge module layers</title>
<desc id="diagram-desc">Tensor is the base layer, and every other module includes it. Activation feeds Layer, Layer feeds Network, Network feeds Optimizer, and Optimizer feeds the example programs. The examples also use Loss directly.</desc>

<marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 Z"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="tip-accent" d="M0,0 L10,5 L0,10 Z"/></marker>
</defs>
<rect class="bg" width="876" height="344"/>
<rect class="node box" x="16" y="16" width="140" height="67" rx="6"/>
<text x="30" y="43" font-size="16" font-weight="600">Activation</text>
<text x="30" y="64" font-size="14" class="muted">ReLU, sigmoid</text>
<rect class="node box" x="192" y="16" width="140" height="67" rx="6"/>
<text x="206" y="43" font-size="16" font-weight="600">Layer</text>
<text x="206" y="64" font-size="14" class="muted">dense</text>
<rect class="node box" x="368" y="16" width="140" height="67" rx="6"/>
<text x="382" y="43" font-size="16" font-weight="600">Network</text>
<text x="382" y="64" font-size="14" class="muted">train, predict</text>
<rect class="node box" x="544" y="16" width="140" height="67" rx="6"/>
<text x="558" y="43" font-size="16" font-weight="600">Optimizer</text>
<text x="558" y="64" font-size="14" class="muted">SGD, Adam</text>
<rect class="node box" x="720" y="16" width="140" height="67" rx="6"/>
<text x="734" y="43" font-size="16" font-weight="600">Examples</text>
<text x="734" y="64" font-size="14" class="muted">XOR, DQN, more</text>
<rect class="node box" x="16" y="120" width="140" height="88" rx="6"/>
<text x="30" y="147" font-size="16" font-weight="600">Loss</text>
<text x="30" y="168" font-size="14" class="muted">MSE</text>
<text x="30" y="189" font-size="14" class="muted">cross-entropy</text>
<rect class="node box" x="16" y="240" width="844" height="88" rx="6"/>
<text x="30" y="267" font-size="16" font-weight="600">Tensor</text>
<text x="30" y="288" font-size="14" class="muted">matmul, transpose, Hadamard products, broadcasting</text>
<text x="30" y="309" font-size="14" class="muted">every module above includes it</text>
<path class="edge" d="M156,49.5 L192,49.5" marker-end="url(#arrow)"/>
<path class="edge" d="M332,49.5 L368,49.5" marker-end="url(#arrow)"/>
<path class="edge" d="M508,49.5 L544,49.5" marker-end="url(#arrow)"/>
<path class="edge" d="M684,49.5 L720,49.5" marker-end="url(#arrow)"/>
<path class="edge" d="M156,164 L790,164 L790,83" marker-end="url(#arrow)"/>
</svg>

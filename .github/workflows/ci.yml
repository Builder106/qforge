name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same PR — speeds up the iteration loop and
# prevents wasteful spend when a contributor force-pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  c-suite:
    name: C unit + integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Format check (clang-format)
        if: runner.os == 'Linux'
        run: clang-format --dry-run --Werror src/*.c include/*.h tests/*.c examples/*.c

      # Windows has no native make/gcc; MSYS2 gives us the same GNU toolchain
      # the Makefile expects (make, gcc, libm) instead of rewriting the build.
      # Network instability can cause "socket hang up" during MSYS2 package downloads.
      # Cache MSYS2 to avoid repeated downloads, and retry the package update with
      # exponential backoff when network failures occur.
      - name: Cache MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: C:\msys64
          key: msys2-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            msys2-${{ runner.os }}-
      - name: Set up MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Run unit tests (engine + scenarios)
        if: runner.os != 'Windows'
        run: make test

      - name: Run unit tests (engine + scenarios, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test

  coverage:
    name: Code coverage (100% target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Run test coverage
        run: make coverage
      - name: Verify 100% line coverage on source files
        run: |
          # Verify every src/*.c file achieves 100% line coverage in gcov
          FAILED=0
          for f in tensor activation loss layer network optimizer; do
            LINES=$(gcov -n test_runner_cov-${f}.gcno | grep -A 1 "File 'src/${f}.c'" | grep "Lines executed:100.00%")
            if [ -z "$LINES" ]; then
              echo "::error::src/${f}.c does not have 100.00% coverage!"
              gcov -n test_runner_cov-${f}.gcno
              FAILED=1
            else
              echo "src/${f}.c: 100.00% line coverage verified"
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

  gcc-sanitizers:
    name: GCC Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
    steps:
      - uses: actions/checkout@v7
      - name: Test with GCC AddressSanitizer (ASan)
        if: matrix.sanitizer == 'asan'
        env:
          CC: gcc
          CFLAGS: "-std=c99 -Wall -Wextra -Werror -pedantic -fsanitize=address -fno-omit-frame-pointer -g -O1"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
        run: |
          make clean
          make CC="$CC" CFLAGS="$CFLAGS" test integration
      - name: Test with GCC UndefinedBehaviorSanitizer (UBSan)
        if: matrix.sanitizer == 'ubsan'
        env:
          CC: gcc
          CFLAGS: "-std=c99 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-omit-frame-pointer -g -O1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          make clean
          make CC="$CC" CFLAGS="$CFLAGS" test integration

  sanitizers:
    name: Clang Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]
    steps:
      - uses: actions/checkout@v7
      - name: Install Clang / LLVM
        run: sudo apt-get update && sudo apt-get install -y clang llvm
      - name: Test with AddressSanitizer (ASan)
        if: matrix.sanitizer == 'asan'
        env:
          CC: clang
          CFLAGS: "-std=c99 -Wall -Wextra -Werror -pedantic -fsanitize=address -fno-omit-frame-pointer -g -O1"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
        run: |
          make clean
          make CC="$CC" CFLAGS="$CFLAGS" test integration
      - name: Test with UndefinedBehaviorSanitizer (UBSan)
        if: matrix.sanitizer == 'ubsan'
        env:
          CC: clang
          CFLAGS: "-std=c99 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-omit-frame-pointer -g -O1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          make clean
          make CC="$CC" CFLAGS="$CFLAGS" test integration


  wasm-build:
    name: WASM build drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Build WebAssembly modules
        run: make wasm

      - name: Confirm built artifacts match committed
        run: |
          if ! git diff --quiet -- web/wasm; then
            echo "::error::web/wasm differs from committed artifacts — run 'make wasm' locally and commit the result"
            git --no-pager diff --stat -- web/wasm
            exit 1
          else
            echo "WASM artifacts in repo match a fresh build"
          fi

      - name: Upload WASM artifacts for browser tests
        uses: actions/upload-artifact@v7
        with:
          name: qforge-wasm
          path: web/wasm/
          retention-days: 1

  e2e:
    name: Web E2E (Playwright + Gherkin BDD)
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v7
        with:
          name: qforge-wasm
          path: web/wasm

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: e2e
        run: npx tsc --noEmit

      - name: Node dependency audit
        working-directory: e2e
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npm run test -- --reporter=list,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  deploy:
    name: Trigger Vercel Deploy
    needs: [secrets, c-suite, coverage, gcc-sanitizers, sanitizers, wasm-build, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deploy hook trigger"
            exit 0
          fi
          curl -sS -f -X POST "$HOOK_URL"
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_PROD is not set; skipping deploy hook trigger"
            exit 1
          fi
          curl -sS -f -X POST "$HOOK_URL"

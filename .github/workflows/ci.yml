name: CI — unit + integration + E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same PR — speeds up the iteration loop and
# prevents wasteful spend when a contributor force-pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  c-suite:
    name: C unit + integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Windows has no native make/gcc; MSYS2 gives us the same GNU toolchain
      # the Makefile expects (make, gcc, libm) instead of rewriting the build.
      # Network instability can cause "socket hang up" during MSYS2 package downloads.
      # Cache MSYS2 to avoid repeated downloads, and retry the package update with
      # exponential backoff when network failures occur.
      - name: Cache MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\msys64
          key: msys2-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            msys2-${{ runner.os }}-
      - name: Set up MSYS2 (Windows only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc make
      - name: Update MSYS2 packages with retry (Windows only)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          max_attempts=3
          attempt=1
          base_delay=30

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts to update MSYS2 packages..."
            if pacman -Syu --noconfirm; then
              echo "MSYS2 package update completed successfully."
              break
            else
              echo "Attempt $attempt failed."
              if [ $attempt -eq $max_attempts ]; then
                echo "All $max_attempts attempts failed. MSYS2 package update failed."
                exit 1
              fi
              delay=$((base_delay * 2 ** (attempt - 1)))
              echo "Waiting $delay seconds before retry..."
              sleep $delay
              attempt=$((attempt + 1))
            fi
          done

      - name: Run unit tests (56 — engine + scenarios)
        if: runner.os != 'Windows'
        run: make test

      - name: Run unit tests (56 — engine + scenarios, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test

      # ASan/UBSan via MinGW-w64 GCC is unreliable (incomplete sanitizer
      # runtime support), so this check stays Linux/macOS only. The plain
      # unit + integration suites above still run everywhere.
      - name: Run ASan + UBSan checks
        if: runner.os != 'Windows'
        run: make clean && make test CFLAGS="-fsanitize=address,undefined -g"

      - name: Run integration tests (compiled example binaries)
        if: runner.os != 'Windows'
        run: make integration

      - name: Run integration tests (compiled example binaries, Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make integration

  wasm-build:
    name: WASM build drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache

      - name: Build WebAssembly modules
        run: make wasm

      - name: Confirm built artifacts match committed
        run: |
          if ! git diff --quiet -- web/wasm; then
            echo "::warning::web/wasm differs from committed artifacts — run 'make wasm' locally and commit the result"
            git --no-pager diff --stat -- web/wasm
          else
            echo "WASM artifacts in repo match a fresh build"
          fi

  e2e:
    name: Web E2E (Playwright + Gherkin BDD)
    runs-on: ubuntu-latest
    needs: c-suite
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Node dependency audit
        working-directory: e2e
        run: npm audit --audit-level=high

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: e2e
        run: npm run test -- --reporter=list,html

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

# ---- Deployment ----
# Vercel handles deployment via its native GitHub integration (auto-deploy on
# push to main, preview deploys on PRs). The CI jobs above run in parallel
# with Vercel's build — they don't gate it. To require these checks before
# Vercel ships to production, enable "Only deploy if checks pass" in the
# Vercel project settings (Settings → Git → Production Branch checks).
